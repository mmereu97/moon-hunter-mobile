name: moon_hunter
description: "Moon Hunter - planificator de fotografie cu Luna (port Flutter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management (simplu, potrivit pentru un prim proiect).
  provider: ^6.1.2

  # Calcule astronomice: poziția Lunii, distanța, iluminarea, faza, răsărit/apus.
  # Pur Dart, funcționează pe toate platformele inclusiv web. Înlocuiește skyfield.
  apsl_sun_calc: ^0.0.2

  # Persistența setărilor într-un fișier JSON (echivalentul moon_settings.json).
  path_provider: ^2.1.4

  # Fus orar din coordonate (înlocuiește timezonefinder).
  timezone: ^0.10.0
  latlong2: ^0.9.1

  # Busolă hardware: heading din magnetometru, pentru rotirea desenului după
  # orientarea telefonului.
  flutter_compass: ^0.8.0

  # Hartă (OpenStreetMap + satelit), pentru planificarea scenei între 2 puncte.
  flutter_map: ^8.0.0

  # GPS: locația reală a telefonului (pentru centrarea hărții pe poziția ta).
  geolocator: ^13.0.0

  # Notificări locale programate (alerte pentru oportunitățile scenelor).
  flutter_local_notifications: ^18.0.0

  # Formatare dată/oră, localizare română.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    # Cele 30 de imagini cu fazele Lunii: luna_0.png .. luna_29.png
    # (echivalentul folderului `poze_cer` din versiunea Python).
    # Declarând folderul, toate fișierele din el sunt incluse automat.
    - assets/moon/

# Configurarea iconiței de lansare. Generează iconițele cu:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/ic_background.png"
  adaptive_icon_foreground: "assets/icon/ic_foreground.png"
